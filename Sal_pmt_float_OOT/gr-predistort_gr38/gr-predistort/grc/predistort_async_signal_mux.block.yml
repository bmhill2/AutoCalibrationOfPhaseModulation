id: predistort_async_signal_mux
label: Async Signal Mux
category: '[predistort]'

templates:
  imports: import predistort
  make: predistort.async_signal_mux(${type.size}, ${num_inputs})

parameters:
- id: type
  label: IO Type
  dtype: enum
  options: [complex, float, int, short, byte]
  option_attributes:
    size: [gr.sizeof_gr_complex, gr.sizeof_float, gr.sizeof_int, gr.sizeof_short, gr.sizeof_char]
  hide: part
- id: num_inputs
  label: Num Inputs
  dtype: int
  default: 2

inputs:
- label: in
  domain: stream
  dtype: ${type}
  multiplicity: ${num_inputs}

- label: ctrl_in
  domain: message
  id: ctrl_in
  optional: true

outputs:
- label: out
  domain: stream
  dtype: ${type}

asserts:
- ${num_inputs > 0}

file_format: 1
