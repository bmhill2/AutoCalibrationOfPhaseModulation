id: predistort_delay_msg
label: Delay Msg
category: '[predistort]'

templates:
  imports: import predistort
  make: predistort.delay_msg(${max_delay})

parameters:
- id: max_delay
  label: Max Delay (Samples)
  dtype: float
  default: '1024'
  hide: none

inputs:
- domain: stream
  dtype: float
  vlen: 1

- label: ctrl_in
  domain: message
  id: ctrl_in
  optional: true

outputs:
- domain: stream
  dtype: float
  vlen: 1

file_format: 1
